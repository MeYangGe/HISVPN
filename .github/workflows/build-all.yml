name: build-all

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-ios"]
    types: [completed]

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  android:
    name: Android APK
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # The setup build hook compiles the Go core for all three Android ABIs
      # with the NDK Flutter downloads; without a keystore the release build
      # falls back to the debug signing config with a .dev id suffix.
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk HISVPN-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HISVPN-android-apk
          path: HISVPN-android.apk

  windows:
    name: Windows portable zip
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: git config --global core.longpaths true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Hooks build the Go core (HISVPNCore.exe) and the Rust helper service.
      - name: Build Windows app
        run: flutter build windows --release

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath HISVPN-windows-portable.zip
          Get-Item HISVPN-windows-portable.zip | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: HISVPN-windows-portable-zip
          path: HISVPN-windows-portable.zip

  macos:
    name: macOS app bundle
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Select the newest installed Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -qry HISVPN-macos.zip *.app
          mv HISVPN-macos.zip ../../../..

      - uses: actions/upload-artifact@v4
        with:
          name: HISVPN-macos-zip
          path: HISVPN-macos.zip

  linux:
    name: Linux bundle
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GTK and build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libpulse-dev ninja-build pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Hooks build the Go core and the Rust helper service (systemd unit).
      - name: Build Linux app
        run: flutter build linux --release

      - name: Package bundle
        run: |
          cd build/linux/x64/release
          tar -czf ../../../HISVPN-linux.tar.gz bundle
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: HISVPN-linux-tar
          path: HISVPN-linux.tar.gz
