name: build-ios

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Select the newest installed Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Dart dependencies
        run: flutter pub get

      # Build the Go core for ios/arm64 explicitly. c-shared is not supported
      # on ios/arm64, so the core is built as a c-archive and linked into a
      # dylib with clang (side-loadable, embeds the same C ABI as the
      # Android .so, see core/lib.go).
      - name: Build Go core for ios/arm64
        run: |
          cd core
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iphoneos SDK: $SDK"
          mkdir -p ../libclash/ios/arm64
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC=clang \
          CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0 -O3" \
          CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
          go build -tags with_gvisor -buildmode=c-archive -ldflags "-w -s" \
            -o ../libclash/ios/arm64/libclash.a .
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -dynamiclib -o ../libclash/ios/arm64/libclash.dylib \
            ../libclash/ios/arm64/libclash.a \
            -framework CoreFoundation
          ls -lh ../libclash/ios/arm64/

      # Xcode 26 rejects a device build without a Development Team even with
      # flutter's --no-codesign; drive xcodebuild directly with signing
      # disabled to produce the unsigned Runner.app.
      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          set -o pipefail
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ../build/xcodebuild.log | tail -40
          APP="../build/ios/dd/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::Runner.app not produced"; exit 1; }
          echo "Built: $APP"

      - name: Log the setup build hook output (diagnostics)
        if: always()
        run: |
          if [ -f .dart_tool/setup_build_cache/hook.log ]; then
            cat .dart_tool/setup_build_cache/hook.log
          else
            echo "no setup hook log; the hook did not run"
          fi

      - name: Embed Go core dylib into the app bundle
        run: |
          APP="build/ios/dd/Build/Products/Release-iphoneos/Runner.app"
          test -f "libclash/ios/arm64/libclash.dylib" || {
            echo "::error::Go core dylib missing"
            exit 1
          }
          mkdir -p "$APP/Frameworks"
          cp libclash/ios/arm64/libclash.dylib "$APP/Frameworks/"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/dd/Build/Products/Release-iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry HISVPN-unsigned.ipa Payload
          ls -lh HISVPN-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HISVPN-unsigned-ipa
          path: build/ipa/HISVPN-unsigned.ipa
