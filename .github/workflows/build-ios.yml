name: build-ios

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Select the newest installed Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Dart dependencies
        run: flutter pub get

      # The setup hook is replaced by the explicit Go build below, and the
      # rust_api hook does not support iOS (upstream ships no aarch64-apple-ios
      # target and its darwin deps do not compile there), so turn both native
      # build hooks into no-ops for this build only.
      - name: Disable native build hooks for the iOS build
        run: |
          perl -0pi -e 's/build_assets: true/build_assets: false/g' pubspec.yaml
          grep -A6 "user_defines" pubspec.yaml

      # Build the Go core for ios/arm64 explicitly. c-shared is not supported
      # on ios/arm64, so the core is built as a c-archive that the Runner
      # target statically links (see ios/Flutter/*.xcconfig force_load) —
      # no dynamic library, no dlopen, no code-signing of embedded binaries.
      - name: Build Go core for ios/arm64
        run: |
          cd core
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iphoneos SDK: $SDK"
          OUT=../libclash/ios/arm64
          mkdir -p "$OUT/includes"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC=clang \
          CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0 -O3" \
          CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
          go build -tags with_gvisor -buildmode=c-archive -ldflags "-w -s" \
            -o "$OUT/libclash.a" .
          # The generated header lands next to the -o output, not in cwd.
          mv "$OUT/libclash.h" "$OUT/includes/libclash.h"
          # Self-check: every symbol the Swift bridge dlsym's must be defined
          # here, so a wrong build fails the pipeline instead of the device.
          for sym in invokeMethod startTUN quickSetup setEventListener \
                     stopTun forceGC updateDns getTraffic getTotalTraffic \
                     protect resolve_uid resolve_package result release_object \
                     free_string release_object_func free_string_func \
                     protect_func resolve_uid_func resolve_package_func \
                     result_func; do
            nm -g "$OUT/libclash.a" | grep -q "_${sym}$" || {
              echo "::error::export '${sym}' missing from libclash.a"
              exit 1
            }
          done
          echo "symbol self-check passed"
          ls -lh "$OUT"

      # Xcode 26 rejects a device build without a Development Team even with
      # flutter's --no-codesign; drive xcodebuild directly with signing
      # disabled to produce the unsigned Runner.app.
      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          set -o pipefail
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ../build/xcodebuild.log
          APP="../build/ios/dd/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::Runner.app not produced"; exit 1; }
          echo "Built: $APP"

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

      - name: Log the setup build hook output (diagnostics)
        if: always()
        run: |
          if [ -f .dart_tool/setup_build_cache/hook.log ]; then
            cat .dart_tool/setup_build_cache/hook.log
          else
            echo "no setup hook log; the hook did not run"
          fi

      # Final gate: the Runner binary must carry the Go exports as global
      # symbols or the Swift bridge cannot resolve them on the device.
      # Fails here instead of on the phone.
      - name: Verify Go exports in the Runner binary
        run: |
          APP="build/ios/dd/Build/Products/Release-iphoneos/Runner.app"
          for sym in invokeMethod startTUN quickSetup setEventListener \
                     stopTun forceGC updateDns getTraffic getTotalTraffic \
                     protect result release_object free_string; do
            nm -gU "$APP/Runner" | grep -q "_${sym}$" || {
              echo "::error::_$(echo ${sym}) missing (global) from Runner"
              nm -gU "$APP/Runner" | head -20
              exit 1
            }
          done
          echo "Runner export check passed"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/dd/Build/Products/Release-iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          IPA="HISVPN-unsigned-r${GITHUB_RUN_NUMBER}.ipa"
          zip -qry "$IPA" Payload
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: HISVPN-unsigned-ipa-r${{ github.run_number }}
          path: build/ipa/HISVPN-unsigned-r${{ github.run_number }}.ipa
