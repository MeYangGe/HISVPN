name: build-ios

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Select the newest installed Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Dart dependencies
        run: flutter pub get

      # The setup hook is replaced by the explicit Go build below, and the
      # rust_api hook does not support iOS (upstream ships no aarch64-apple-ios
      # target and its darwin deps do not compile there), so turn both native
      # build hooks into no-ops for this build only.
      - name: Disable native build hooks for the iOS build
        run: |
          perl -0pi -e 's/build_assets: true/build_assets: false/g' pubspec.yaml
          grep -A6 "user_defines" pubspec.yaml

      # Build the Go core for ios/arm64 explicitly. c-shared is not supported
      # on ios/arm64, so the core is built as a c-archive, linked into a
      # dylib with clang, and assembled into a proper framework bundle — bare
      # dylibs dropped in Frameworks/ are rejected by dyld/hardened runtime
      # and poorly handled by side-load signers.
      - name: Build Go core for ios/arm64
        run: |
          cd core
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iphoneos SDK: $SDK"
          OUT=../libclash/ios/arm64
          mkdir -p "$OUT"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC=clang \
          CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0 -O3" \
          CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0" \
          go build -tags with_gvisor -buildmode=c-archive -ldflags "-w -s" \
            -o "$OUT/libclash.a" .
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -dynamiclib \
            -install_name @rpath/HISVPNCore.framework/HISVPNCore \
            -o "$OUT/HISVPNCore" \
            "$OUT/libclash.a" \
            -framework CoreFoundation
          FW="$OUT/HISVPNCore.framework"
          mkdir -p "$FW"
          mv "$OUT/HISVPNCore" "$FW/HISVPNCore"
          cat > "$FW/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>HISVPNCore</string>
            <key>CFBundleIdentifier</key>
            <string>com.hisvpn.HISVPNCore</string>
            <key>CFBundleName</key>
            <string>HISVPNCore</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
          </dict>
          </plist>
          PLIST
          ls -lh "$FW"

      # Xcode 26 rejects a device build without a Development Team even with
      # flutter's --no-codesign; drive xcodebuild directly with signing
      # disabled to produce the unsigned Runner.app.
      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          set -o pipefail
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ../build/xcodebuild.log
          APP="../build/ios/dd/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::Runner.app not produced"; exit 1; }
          echo "Built: $APP"

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

      - name: Log the setup build hook output (diagnostics)
        if: always()
        run: |
          if [ -f .dart_tool/setup_build_cache/hook.log ]; then
            cat .dart_tool/setup_build_cache/hook.log
          else
            echo "no setup hook log; the hook did not run"
          fi

      - name: Embed Go core framework into the app bundle
        run: |
          APP="build/ios/dd/Build/Products/Release-iphoneos/Runner.app"
          FW="libclash/ios/arm64/HISVPNCore.framework"
          test -f "$FW/HISVPNCore" || {
            echo "::error::Go core framework missing"
            exit 1
          }
          mkdir -p "$APP/Frameworks"
          cp -R "$FW" "$APP/Frameworks/"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/dd/Build/Products/Release-iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry HISVPN-unsigned.ipa Payload
          ls -lh HISVPN-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HISVPN-unsigned-ipa
          path: build/ipa/HISVPN-unsigned.ipa
